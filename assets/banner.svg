<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Welcome to Mithilesh's GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90"  cy="40"  r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="70"  r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="30"  r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="45"  r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="25"  r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="65" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- dunes -->
  <path d="M0,190 C200,140 380,185 600,160 C820,135 1000,185 1200,150 L1200,300 L0,300 Z" fill="#3a3a3a"/>
  <path d="M0,225 C240,185 450,240 700,212 C920,188 1060,230 1200,205 L1200,300 L0,300 Z" fill="#161616"/>

  <!-- winding path -->
  <path d="M640,300 C560,275 700,255 610,232 C540,214 650,200 600,180" fill="none" stroke="url(#river)" stroke-width="10" stroke-linecap="round"/>

  <!-- title -->
  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="36" letter-spacing="3">Welcome to Mithilesh's GitHub</text>
  <text x="600" y="150" text-anchor="middle" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="28">&lt;/&gt;</text>
</svg>
